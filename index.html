<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva Aula</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="contenedor">
        <h1>Reserva Aula</h1>

        <!-- Formulario de reserva -->
        <form id="formulario-reserva">
            <h2>Nueva Reserva</h2>

            <label for="aula">Aula:</label>
            <select id="aula" required>
                <option value="">-- Seleccionar aula --</option>
                <option value="A101">A101</option>
                <option value="A102">A102</option>
                <option value="B201">B201</option>
                <option value="B202">B202</option>
                <option value="C301">C301</option>
            </select>

            <label for="fecha">Fecha:</label>
            <input type="date" id="fecha" required>

            <label for="horario">Horario:</label>
            <select id="horario" required>
                <option value="">-- Seleccionar horario --</option>
                <option value="08:00 - 10:00">08:00 - 10:00</option>
                <option value="10:00 - 12:00">10:00 - 12:00</option>
                <option value="14:00 - 16:00">14:00 - 16:00</option>
                <option value="16:00 - 18:00">16:00 - 18:00</option>
            </select>

            <label for="actividad">Actividad:</label>
            <input type="text" id="actividad" placeholder="Ej: Clase de Matemáticas" required>

            <button type="submit">Reservar</button>
        </form>

        <!-- Mensajes de error o éxito -->
        <div id="mensaje"></div>

        <!-- Indicadores de disponibilidad -->
        <h2>Disponibilidad de Aulas</h2>
        <div id="disponibilidad"></div>

        <!-- Tabla de reservas -->
        <h2>Reservas Realizadas</h2>
        <table>
            <thead>
                <tr>
                    <th>Aula</th>
                    <th>Fecha</th>
                    <th>Horario</th>
                    <th>Actividad</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-reservas">
                <!-- Las filas se agregan dinámicamente con JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="app.js"></script>
</body>
</html>
